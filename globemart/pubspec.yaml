name: globemart
description: "Aplikasi E-Commerce + Utility GlobeMart"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ================= DATABASE =================
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ================= SECURITY =================
  crypto: ^3.0.3

  # ================= NETWORK =================
  http: ^1.2.0

  # ================= IMAGE ===================
  image_picker: ^1.0.7

  # ================= LOCATION =================
  geolocator: ^10.1.0

  # ================= NOTIFICATION =============
  flutter_local_notifications: ^16.3.2
  timezone: ^0.9.2

  # ================= PDF ======================
  pdf: ^3.10.7
  printing: ^5.12.0
  path_provider: ^2.1.2

  # ================= UI SUPPORT ===============
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  geocoding: ^3.0.0
  qr_flutter: ^4.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1


flutter:
  uses-material-design: true

  assets:
    - assets/images/
